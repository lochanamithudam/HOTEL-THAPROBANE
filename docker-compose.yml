services:
  # 1. MongoDB Database Container
  database:
    image: mongo:latest
    container_name: hotel-mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Node.js Web App Container
  web-app:
    build: .
    container_name: hotel-site
    restart: always
    ports:
      - "8080:5000"
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://database:27017/hotel_db}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
      - EMAIL_USER=${EMAIL_USER:-${GMAIL_USER}}
      - EMAIL_PASS=${EMAIL_PASS:-${GMAIL_PASS}}
    depends_on:
      - database

volumes:
  mongo-data:
